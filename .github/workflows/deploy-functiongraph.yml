name: 部署到华为云 FunctionGraph

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functiongraph-production
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署 Web MVP
    if: ${{ vars.HUAWEICLOUD_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deploy/functiongraph/requirements.txt
            scripts/requirements-deploy.txt

      - name: 构建 FunctionGraph 部署包
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: ./scripts/build-functiongraph-package.sh

      - name: 安装华为云官方 SDK
        run: python -m pip install --quiet --disable-pip-version-check -r scripts/requirements-deploy.txt

      - name: 更新 FunctionGraph 函数代码
        env:
          HUAWEICLOUD_ACCESS_KEY_ID: ${{ secrets.HUAWEICLOUD_ACCESS_KEY_ID }}
          HUAWEICLOUD_SECRET_ACCESS_KEY: ${{ secrets.HUAWEICLOUD_SECRET_ACCESS_KEY }}
          HUAWEICLOUD_PROJECT_ID: ${{ vars.HUAWEICLOUD_PROJECT_ID }}
          HUAWEICLOUD_REGION: ${{ vars.HUAWEICLOUD_REGION }}
          FUNCTIONGRAPH_FUNCTION_URN: ${{ vars.FUNCTIONGRAPH_FUNCTION_URN }}
        run: python scripts/deploy_functiongraph.py
